name: CI / Security / Architecture Guardrails

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Validate Gateway
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Verify Python 3.12 Runtime Version
        run: |
          PYTHON_VERSION=$(python --version)
          echo "Active Python runtime: $PYTHON_VERSION"
          if [[ ! "$PYTHON_VERSION" =~ Python\ 3\.12 ]]; then
            echo "::error::Unexpected Python version. Required: Python 3.12.x, found: $PYTHON_VERSION"
            exit 1
          fi

      - name: 4. Install Dependencies & Verify Imports
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -c "import app.main, app.api.endpoints, app.core.config, app.services.hdfs_service; print('All core modules imported successfully')"

      - name: 5. Code Quality Check (Ruff)
        run: |
          ruff check .

      - name: 6. Automated Unit Tests (Pytest)
        run: |
          pytest -q

      - name: 7. Configuration & Environment Integrity Checks
        run: |
          echo "Verifying .env.example exists and .env is not tracked..."
          if [ ! -f ".env.example" ]; then
            echo "::error::.env.example is missing from repository"
            exit 1
          fi

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env file is tracked in Git. It must be untracked and excluded via .gitignore."
            exit 1
          fi

          REQUIRED_KEYS=(
            "APP_NAME"
            "APP_ENV"
            "DEBUG"
            "HOST"
            "PORT"
            "HDFS_NAMENODE_URL"
            "HDFS_USER"
            "HDFS_DEFAULT_DIR"
            "HDFS_TIMEOUT_SECONDS"
          )

          for key in "${REQUIRED_KEYS[@]}"; do
            if ! grep -q "^$key=" .env.example; then
              echo "::error::Missing required configuration key in .env.example: $key"
              exit 1
            fi
          done
          echo "All required configuration keys present in .env.example."

      - name: 8. Secrets & Sensitive File Protection
        run: |
          echo "Scanning for accidental secret patterns in tracked files..."
          
          # Check for private keys
          if git grep -I -E "BEGIN (RSA|OPENSSH|DSA|EC|PGP) PRIVATE KEY" -- . ':!.github/workflows/*' >/dev/null 2>&1; then
            echo "::error::Private key detected in tracked repository files!"
            exit 1
          fi

          # Check for AWS keys
          if git grep -I -E "AKIA[0-9A-Z]{16}" -- . ':!.github/workflows/*' >/dev/null 2>&1; then
            echo "::error::AWS Access Key ID pattern detected in tracked repository files!"
            exit 1
          fi

          echo "Secrets scan passed: No private keys or credential patterns found."

      - name: 9. Hadoop Internal Storage & Runtime Protection
        run: |
          echo "Verifying no Hadoop runtime/internal storage data is tracked..."
          FORBIDDEN_PATTERNS=(
            "hadoopdata/"
            "namenode/current/"
            "datanode/current/"
            "fsimage"
            "edits_"
            "*.block"
            "*.meta"
          )

          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            if git ls-files | grep -E "$pattern" >/dev/null 2>&1; then
              echo "::error::Hadoop internal storage file matching pattern '$pattern' found in Git index! Repository must not contain Hadoop data."
              exit 1
            fi
          done
          echo "Hadoop storage check passed: No Hadoop internal storage files found."

      - name: 10. Docker & Compose Architecture Guardrails
        run: |
          echo "Verifying Dockerfile is an isolated FastAPI container without Hadoop..."
          if grep -i -E "(apt-get.*hadoop|tar -xzf.*hadoop|wget.*hadoop.*tar\.gz|dfs\.namenode)" Dockerfile >/dev/null 2>&1; then
            echo "::error::Dockerfile appears to install or containerize Hadoop. Hadoop is external infrastructure."
            exit 1
          fi

          if ! grep -q "EXPOSE 5005" Dockerfile; then
            echo "::error::Dockerfile must expose port 5005 for the FastAPI Gateway."
            exit 1
          fi

          echo "Verifying docker-compose.yml adheres to host networking without Hadoop cluster services..."
          if grep -i -E "(namenode:|datanode:|resourcemanager:|nodemanager:)" docker-compose.yml >/dev/null 2>&1; then
            echo "::error::docker-compose.yml contains Hadoop services. Hadoop must remain external infrastructure."
            exit 1
          fi

          if ! grep -q "network_mode: host" docker-compose.yml; then
            echo "::error::docker-compose.yml must specify 'network_mode: host' for Linux VM host deployment."
            exit 1
          fi

          echo "Docker architecture guardrails passed."

      - name: 11. Repository Hygiene Check
        run: |
          echo "Checking for accidental build or cache artifacts..."
          HYGIENE_PATTERNS=(
            "\.pyc$"
            "__pycache__"
            "\.ruff_cache"
            "\.pytest_cache"
            "\.DS_Store"
            "\.venv"
            "\.env$"
          )

          for pattern in "${HYGIENE_PATTERNS[@]}"; do
            if git ls-files | grep -E "$pattern" >/dev/null 2>&1; then
              echo "::error::Disallowed artifact matching '$pattern' found tracked in repository!"
              exit 1
            fi
          done
          echo "Repository hygiene check passed."

      - name: 12. Production Docker Build Validation
        run: |
          echo "Building production Docker image..."
          docker build -t hdfs-gateway-ci:latest .
          echo "Docker image built successfully."
